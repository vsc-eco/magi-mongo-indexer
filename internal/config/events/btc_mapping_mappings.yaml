# ===============================
# BTC MAPPING CONTRACT - STATIC MAPPING
# ===============================
#
# The BTC mapping contract has a known address. Events are CSV format
# with "|" delimiter and "=" key separator.
# ===============================

contracts:
  - address: "vsc1BdrQ6EtbQ64rq2PkPd21x4MaLnVRcJj85d"
    events:
      # Deposit Events - BTC deposited and credited to VSC account
      - log_type: "dep"
        table: "btc_mapping_deposit_events"
        schema:
          recipient: string
          sender: string
          amount: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          recipient: "1"
          sender: "2"
          amount: "3"

      # Map Events - same as deposit, alternate log type
      - log_type: "map"
        table: "btc_mapping_deposit_events"
        schema:
          recipient: string
          sender: string
          amount: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          recipient: "1"
          sender: "2"
          amount: "3"

      # Fee Events - fees charged on unmap
      - log_type: "fee"
        table: "btc_mapping_fee_events"
        schema:
          magi_fee: numeric
          btc_fee: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          magi_fee: "1"
          btc_fee: "2"

      # Transfer Events - BTC transferred between accounts
      - log_type: "xfer"
        table: "btc_mapping_transfer_events"
        schema:
          from_addr: string
          to_addr: string
          amount: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          from_addr: "1"
          to_addr: "2"
          amount: "3"

      # Unmap Events - BTC withdrawal initiated
      - log_type: "unm"
        table: "btc_mapping_unmap_events"
        schema:
          tx_id: string
          from_addr: string
          deducted: numeric
          sent: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          tx_id: "1"
          from_addr: "2"
          deducted: "3"
          sent: "4"

      - log_type: "unmap"
        table: "btc_mapping_unmap_events"
        schema:
          tx_id: string
          from_addr: string
          to_addr: string
          deducted: numeric
          sent: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          tx_id: "1"
          from_addr: "2"
          to_addr: "3"
          deducted: "4"
          sent: "5"

      # UTXO migration between key generations, plus schema-version markers
      # migrate|src=1|dst=2|id=<txid>|swept=372026|fee=1403|more=false
      # migrate|v=1   /   migrate|v=2|fold_gen0
      - log_type: "migrate"
        table: "btc_mapping_migrate_events"
        schema:
          src_gen: numeric
          dst_gen: numeric
          tx_id: string
          swept: numeric
          fee: numeric
          more: string
          schema_version: numeric
          marker: string
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        variants:
          - field_count: 7
            fields:
              src_gen: "1"
              dst_gen: "2"
              tx_id: "3"
              swept: "4"
              fee: "5"
              more: "6"
          - field_count: 2
            fields:
              schema_version: "1"
          - field_count: 3
            fields:
              schema_version: "1"
              marker: "2"

      # Fee reserve movements — feereserve|topup|txid=<txid>|credited=5000|feeSupply=44436
      - log_type: "feereserve"
        table: "btc_mapping_fee_reserve_events"
        schema:
          action: string
          tx_id: string
          credited: numeric
          fee_supply: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          action: "1"
          tx_id: "2"
          credited: "3"
          fee_supply: "4"

      # dust-skip|addr=<btc addr>|sats=900
      - log_type: "dust-skip"
        table: "btc_mapping_dust_skip_events"
        schema:
          addr: string
          sats: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          addr: "1"
          sats: "2"

      # dust-writeoff|gen=0|sats=636|chargedTo=feeReserve|feeSupply=21950
      - log_type: "dust-writeoff"
        table: "btc_mapping_dust_writeoff_events"
        schema:
          gen: numeric
          sats: numeric
          charged_to: string
          fee_supply: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          gen: "1"
          sats: "2"
          charged_to: "3"
          fee_supply: "4"

      # sweep-abandon|txid=<txid>|input=16|writtenOff=20365|members=2|feeSupply=22721
      - log_type: "sweep-abandon"
        table: "btc_mapping_sweep_abandon_events"
        schema:
          tx_id: string
          input: numeric
          written_off: numeric
          members: numeric
          fee_supply: numeric
        parse: "csv"
        delimiter: "|"
        key_delimiter: "="
        fields:
          tx_id: "1"
          input: "2"
          written_off: "3"
          members: "4"
          fee_supply: "5"

      # Key generation folded into the active one — fold|gen0
      - log_type: "fold"
        table: "btc_mapping_fold_events"
        schema:
          generation: string
        parse: "csv"
        delimiter: "|"
        fields:
          generation: "1"
